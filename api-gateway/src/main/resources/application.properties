spring.application.name=api-gateway
server.port=8082
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=gateway
server.ssl.key-store-password=${KEYSTORE_PASSWORD:changeit}

backend.url=http://localhost:8081

jwt.secret=troque-esta-chave-por-uma-bem-longa-com-no-minimo-32-caracteres
jwt.issuer=gateway-seguro
jwt.expiration-minutes=15

rate-limit.max-requests=10